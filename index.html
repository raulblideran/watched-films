<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>🎬 Movie & Series Collection</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'primary': '#e94560',
                            'primary-dark': '#8b0000',
                        },
                        animation: {
                            'fadeInDown': 'fadeInDown 0.6s ease',
                            'fadeInUp': 'fadeInUp 0.6s ease',
                            'fadeIn': 'fadeIn 0.3s ease',
                            'slideUp': 'slideUp 0.3s ease',
                            'pulse-slow': 'pulse 1.5s ease-in-out infinite',
                        },
                        keyframes: {
                            fadeInDown: {
                                '0%': { opacity: '0', transform: 'translateY(-30px)' },
                                '100%': { opacity: '1', transform: 'translateY(0)' },
                            },
                            fadeInUp: {
                                '0%': { opacity: '0', transform: 'translateY(30px)' },
                                '100%': { opacity: '1', transform: 'translateY(0)' },
                            },
                            fadeIn: {
                                '0%': { opacity: '0' },
                                '100%': { opacity: '1' },
                            },
                            slideUp: {
                                '0%': { opacity: '0', transform: 'translateY(50px)' },
                                '100%': { opacity: '1', transform: 'translateY(0)' },
                            },
                        }
                    }
                }
            }
        </script>
        <style>
            /* Custom styles for collapse functionality and special effects */
            .input-section.collapsed .input-group,
            .input-section.collapsed .btn-wrapper {
                display: none;
            }

            .input-section.collapsed .collapse-icon {
                transform: rotate(180deg);
            }

            #filtersSection.collapsed {
                max-height: 0 !important;
            }

            #filtersSection:not(.collapsed) {
                max-height: 1000px;
            }

            .modal-poster.hidden {
                display: none;
            }


            /* Custom scrollbar for genre filters */
            #genreFilters::-webkit-scrollbar {
                width: 8px;
            }
            #genreFilters::-webkit-scrollbar-track {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 10px;
            }
            #genreFilters::-webkit-scrollbar-thumb {
                background: #e94560;
                border-radius: 10px;
            }
            #genreFilters::-webkit-scrollbar-thumb:hover {
                background: #c41e3a;
            }

            /* Card top border gradient */
            .card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                background: linear-gradient(90deg, #e94560 0%, #8b0000 100%);
            }
        </style>
    </head>
    <body class="min-h-screen p-5 text-white bg-gradient-to-br from-[#0a0a0a] via-[#1a0000] to-black font-sans">
        <div class="container mx-auto max-w-full">
            <!-- Hero Section -->
            <div class="text-center mb-12 animate-fadeInDown">
                <h1 class="text-6xl md:text-7xl mb-3 font-black bg-gradient-to-r from-primary via-red-400 to-primary bg-clip-text text-transparent" style="text-shadow: 0 0 40px rgba(233, 69, 96, 0.3)">
                    🎬 Movie & Series Collection
                </h1>
            </div>

            <!-- Stats Section -->
            <div class="flex gap-4 justify-center flex-wrap mb-10 max-w-6xl mx-auto" id="stats"></div>

            <!-- Load Section -->
            <div class="bg-gradient-to-br from-white/5 to-white/10 backdrop-blur-xl p-5 rounded-2xl border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.4)] mb-10 animate-fadeInUp max-w-3xl mx-auto transition-all duration-300 overflow-hidden hover:border-primary/30 input-section" id="inputSection">
                <div class="flex justify-between items-center cursor-pointer collapse-header" onclick="toggleInputSection()">
                    <div class="flex items-center gap-2">
                        <span class="text-2xl">📋</span>
                        <h3 class="m-0 text-base font-semibold">Load Collection</h3>
                    </div>
                    <span class="text-lg transition-transform duration-300 collapse-icon">▼</span>
                </div>
                <div class="mb-3 input-group">
                    <label for="csvData" class="block mb-2 text-sm text-gray-300">Paste your watchlist data</label>
                    <textarea
                        id="csvData"
                        placeholder="Paste your CSV data here..."
                        class="w-full px-3 py-2.5 border border-white/10 bg-black/40 text-white rounded-lg text-xs font-mono min-h-[120px] transition-all duration-300 focus:outline-none focus:border-primary/50 focus:ring-2 focus:ring-primary/20 hover:border-white/20"
                    ></textarea>
                </div>
                <div class="flex gap-2 flex-wrap btn-wrapper">
                    <button class="bg-gradient-to-r from-primary to-red-600 text-white px-6 py-2 border-none rounded-lg text-sm font-semibold cursor-pointer transition-all duration-200 hover:scale-105 hover:shadow-[0_8px_20px_rgba(233,69,96,0.5)]" onclick="loadData()">
                        Load from Paste
                    </button>
                    <button class="bg-gradient-to-r from-gray-700 to-gray-800 text-white px-6 py-2 border-none rounded-lg text-sm font-semibold cursor-pointer transition-all duration-200 hover:scale-105 hover:shadow-[0_8px_20px_rgba(255,255,255,0.1)]" onclick="loadFromGitHub()">
                        🔄 Reload from GitHub
                    </button>
                </div>
            </div>

            <div class="text-center p-4 rounded-xl my-5 mx-auto max-w-2xl hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm backdrop-blur-md" id="error"></div>
            <div class="text-center p-4 rounded-xl my-5 mx-auto max-w-2xl hidden bg-green-500/10 border border-green-500/30 text-green-400 text-sm backdrop-blur-md" id="success"></div>
            <div class="text-center p-4 rounded-xl my-5 mx-auto max-w-2xl hidden text-white text-lg backdrop-blur-md bg-white/5 border border-white/10" id="loading">
                <span class="inline-block animate-pulse-slow">✨</span> Loading your collection...
            </div>

            <div class="bg-gradient-to-br from-white/5 to-white/10 backdrop-blur-xl rounded-2xl border border-white/10 mb-8 animate-fadeInUp hidden controls p-4" id="controls">
                <!-- Search and Sort Row -->
                <div class="flex gap-3 items-center mb-4 flex-wrap">
                    <div class="flex-1 min-w-[300px]">
                        <input
                            type="text"
                            class="w-full px-4 py-2.5 border border-white/10 bg-black/40 text-white rounded-lg text-sm focus:outline-none focus:border-primary/50 focus:ring-2 focus:ring-primary/20 hover:border-white/20 transition-all"
                            id="searchBox"
                            placeholder="🔍 Search by title, genre, or anything..."
                            onkeyup="filterCards()"
                        />
                    </div>
                    <div class="relative">
                        <select
                            id="sortSelect"
                            onchange="sortCards()"
                            class="appearance-none flex items-center gap-2 bg-yellow-500/10 hover:bg-yellow-500/20 border border-yellow-500/30 px-4 py-2.5 rounded-lg text-sm font-semibold text-yellow-500 transition-all cursor-pointer focus:outline-none pr-8"
                        >
                            <option value="name" class="bg-gray-900 text-white">📝 Name (A-Z)</option>
                            <option value="rating-desc" class="bg-gray-900 text-white">⭐ Rating (High to Low)</option>
                            <option value="rating-asc" class="bg-gray-900 text-white">⭐ Rating (Low to High)</option>
                            <option value="date-latest" class="bg-gray-900 text-white">📅 Latest Watch</option>
                            <option value="date-first" class="bg-gray-900 text-white">📅 First Watch</option>
                            <option value="watch-count" class="bg-gray-900 text-white">🔢 Watch Count</option>
                        </select>
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-yellow-500 pointer-events-none text-xs">▼</span>
                    </div>
                    <button
                        class="flex items-center gap-2 bg-primary/10 hover:bg-primary/20 border border-primary/30 px-4 py-2.5 rounded-lg text-sm font-semibold text-primary transition-all cursor-pointer"
                        onclick="toggleFilters()"
                    >
                        <span>🔍 Filters</span>
                        <span class="text-xs transition-transform duration-300 collapse-icon" id="filterToggleIcon">▼</span>
                    </button>
                </div>

                <!-- Filters Section (Collapsible) -->
                <div id="filtersSection" class="transition-all duration-300 overflow-hidden collapsed">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4 pt-3 border-t border-white/10 filter-grid">
                        <div>
                            <h3 class="mb-2 text-xs uppercase tracking-wider text-gray-400 font-semibold">📺 Type</h3>
                            <div class="flex gap-2 flex-wrap filter-buttons" id="typeFilters"></div>
                        </div>

                        <div>
                            <h3 class="mb-2 text-xs uppercase tracking-wider text-gray-400 font-semibold">🎭 Genre</h3>
                            <div class="flex gap-2 flex-wrap max-h-[200px] overflow-y-auto pr-1 filter-buttons" id="genreFilters"></div>
                        </div>

                        <div>
                            <h3 class="mb-2 text-xs uppercase tracking-wider text-gray-400 font-semibold">⭐ Rating</h3>
                            <div class="flex gap-2 flex-wrap filter-buttons" id="ratingFilters"></div>
                        </div>

                        <div>
                            <h3 class="mb-2 text-xs uppercase tracking-wider text-gray-400 font-semibold">💿 Physical Format</h3>
                            <div class="flex gap-2 flex-wrap filter-buttons" id="physicalFormatFilters"></div>
                        </div>

                        <div>
                            <h3 class="mb-2 text-xs uppercase tracking-wider text-gray-400 font-semibold">🎥 Special</h3>
                            <div class="flex gap-2 flex-wrap filter-buttons" id="specialFilters"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-5 mt-8" id="cardsGrid"></div>
        </div>

        <div class="hidden fixed z-[1000] left-0 top-0 w-full h-full bg-black/90 animate-fadeIn items-center justify-center p-5 modal" id="modal">
            <div class="bg-gradient-to-br from-[#0a0a0a] to-[#1a0000] rounded-3xl max-w-5xl w-full max-h-[90vh] overflow-y-auto relative border-2 border-primary/50 shadow-2xl animate-slideUp flex flex-col md:flex-row modal-content">
                <button class="absolute top-5 right-5 bg-black/70 border-2 border-primary text-white text-3xl w-12 h-12 rounded-full cursor-pointer flex items-center justify-center transition-all duration-300 z-10 hover:bg-primary hover:rotate-90 close-btn" onclick="closeModal()">×</button>
                <img id="modalPoster" class="w-full md:w-[350px] md:min-w-[350px] h-auto min-h-full object-contain rounded-t-3xl md:rounded-l-3xl md:rounded-tr-none bg-gradient-to-br from-primary/30 to-black/50 modal-poster hidden" alt="" />
                <div class="p-8 flex-1 overflow-y-auto modal-body" id="modalBody"></div>
            </div>
        </div>

        <script>
            // Configuration
            const TMDB_CONFIG = {
                API_KEY: "db67114849ccd9aeab6073a574092ee0",
                BASE_URL: "https://api.themoviedb.org/3",
                IMAGE_BASE_URL: "https://image.tmdb.org/t/p/w500",
            };

            // GitHub CSV file URL - UPDATE THIS WITH YOUR REPO URL
            const CSV_FILE_URL =
                "https://raw.githubusercontent.com/raulblideran/watched-films/main/movies.csv";

            let allData = [];
            let filteredData = [];
            let headers = [];
            let activeFilters = {
                type: "all",
                genre: "all",
                rating: "all",
                physicalFormat: "all",
                special: "all",
            };
            let posterCache = {};

            function showError(message) {
                const errorEl = document.getElementById("error");
                errorEl.textContent = message;
                errorEl.classList.remove("hidden");
                errorEl.classList.add("block");
                setTimeout(() => {
                    errorEl.classList.add("hidden");
                    errorEl.classList.remove("block");
                }, 8000);
            }

            function showSuccess(message) {
                const successEl = document.getElementById("success");
                successEl.textContent = message;
                successEl.classList.remove("hidden");
                successEl.classList.add("block");
                setTimeout(() => {
                    successEl.classList.add("hidden");
                    successEl.classList.remove("block");
                }, 3000);

                // Collapse input section after successful load
                const inputSection = document.getElementById("inputSection");
                setTimeout(() => {
                    inputSection.classList.add("collapsed");
                }, 1000);
            }

            function toggleInputSection() {
                document
                    .getElementById("inputSection")
                    .classList.toggle("collapsed");
            }

            function toggleFilters() {
                const filtersSection = document.getElementById("filtersSection");
                const filterIcon = document.getElementById("filterToggleIcon");
                filtersSection.classList.toggle("collapsed");

                if (filtersSection.classList.contains("collapsed")) {
                    filterIcon.style.transform = "rotate(0deg)";
                } else {
                    filterIcon.style.transform = "rotate(180deg)";
                }
            }

            async function loadFromGitHub() {
                showLoading(true);

                try {
                    // Add cache-busting parameter to always fetch latest version
                    const cacheBuster = `?t=${new Date().getTime()}`;
                    const response = await fetch(CSV_FILE_URL + cacheBuster);
                    if (!response.ok) {
                        throw new Error("Failed to load CSV from GitHub");
                    }

                    const csvText = await response.text();
                    parseCSV(csvText);
                    showSuccess(
                        "✅ Collection loaded from GitHub! Found " +
                            allData.length +
                            " titles.",
                    );
                } catch (error) {
                    showError("Error loading from GitHub: " + error.message);
                    showLoading(false);
                }
            }

            // Auto-load on page load if CSV_FILE_URL is configured
            window.addEventListener("DOMContentLoaded", function () {
                if (CSV_FILE_URL && !CSV_FILE_URL.includes("YOUR_USERNAME")) {
                    loadFromGitHub();
                }
            });

            function showLoading(show) {
                const loading = document.getElementById("loading");
                if (show) {
                    loading.classList.remove("hidden");
                    loading.classList.add("block");
                } else {
                    loading.classList.add("hidden");
                    loading.classList.remove("block");
                }
            }

            async function fetchMoviePoster(
                title,
                firstWatch,
                comments,
                genre,
            ) {
                const cacheKey = `${title}_${comments}_${genre}`;
                if (posterCache[cacheKey]) {
                    return posterCache[cacheKey];
                }

                // Without API key, return null
                if (
                    !TMDB_CONFIG.API_KEY ||
                    TMDB_CONFIG.API_KEY === "YOUR_API_KEY_HERE"
                ) {
                    posterCache[cacheKey] = null;
                    return null;
                }

                try {
                    const searchQuery = encodeURIComponent(title);

                    // Search WITHOUT year filter first (best for most movies)
                    const url = `${TMDB_CONFIG.BASE_URL}/search/multi?api_key=${TMDB_CONFIG.API_KEY}&query=${searchQuery}`;
                    const response = await fetch(url);
                    const data = await response.json();

                    if (data.results && data.results.length > 0) {
                        let result = data.results[0]; // Default to first result

                        // Try to extract year from Comments column (e.g., "1978", "(2018)", "year: 1995")
                        let searchYear = "";
                        if (comments) {
                            const yearMatch = comments.match(
                                /\b(19\d{2}|20\d{2})\b/,
                            ); // Match years 1900-2099
                            if (yearMatch) {
                                searchYear = yearMatch[0];
                            }
                        }

                        // Check if Genre contains "Anime"
                        const genreLower = (genre || "").toLowerCase();
                        const isAnime = genreLower.includes("anime");

                        // If we have multiple results, try to find the best match
                        if (data.results.length > 1) {
                            let candidates = data.results;

                            // Filter by year if available
                            if (searchYear) {
                                const yearMatches = candidates.filter((r) => {
                                    const releaseDate =
                                        r.release_date ||
                                        r.first_air_date ||
                                        "";
                                    return releaseDate.startsWith(searchYear);
                                });
                                if (yearMatches.length > 0) {
                                    candidates = yearMatches;
                                }
                            }

                            // If genre is "Anime", prioritize Japanese productions
                            if (isAnime && candidates.length > 1) {
                                const animeMatch = candidates.find((r) => {
                                    const originCountry =
                                        r.origin_country || [];
                                    return (
                                        originCountry.includes("JP") ||
                                        r.original_language === "ja"
                                    );
                                });
                                if (animeMatch) {
                                    result = animeMatch;
                                } else {
                                    result = candidates[0];
                                }
                            } else {
                                result = candidates[0];
                            }
                        }

                        const posterPath = result.poster_path;
                        if (posterPath) {
                            const posterUrl = `${TMDB_CONFIG.IMAGE_BASE_URL}${posterPath}`;
                            posterCache[cacheKey] = posterUrl;
                            return posterUrl;
                        }
                    }
                } catch (error) {
                    console.error("Error fetching poster:", error);
                }

                posterCache[cacheKey] = null;
                return null;
            }

            function loadData() {
                const csvText = document.getElementById("csvData").value.trim();

                if (!csvText) {
                    showError("Please paste data in the text box");
                    return;
                }

                showLoading(true);

                try {
                    parseCSV(csvText);
                    showSuccess(
                        "✅ Collection loaded! Found " +
                            allData.length +
                            " titles.",
                    );
                } catch (error) {
                    showError("Error parsing data: " + error.message);
                    showLoading(false);
                }
            }

            function parseCSV(csvText) {
                const lines = csvText
                    .split("\n")
                    .filter((line) => line.trim() !== "");

                if (lines.length < 2) {
                    showError("Not enough data");
                    showLoading(false);
                    return;
                }

                const firstLine = lines[0];
                const delimiter = firstLine.includes("\t") ? "\t" : ",";

                headers = parseCSVLine(lines[0], delimiter);

                allData = [];
                for (let i = 1; i < lines.length; i++) {
                    const values = parseCSVLine(lines[i], delimiter);
                    if (values.some((v) => v.trim() !== "")) {
                        const row = {};
                        headers.forEach((header, index) => {
                            row[header] = values[index] || "";
                        });
                        if (row["Name"] && row["Name"].trim()) {
                            allData.push(row);
                        }
                    }
                }

                if (allData.length === 0) {
                    showError("No data rows found");
                    showLoading(false);
                    return;
                }

                filteredData = [...allData];
                displayStats();
                createFilters();
                displayCards(filteredData);
                const controls = document.getElementById("controls");
                controls.classList.remove("hidden");
                controls.classList.add("block");
                showLoading(false);
            }

            function parseCSVLine(line, delimiter = ",") {
                const values = [];
                let current = "";
                let inQuotes = false;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    const nextChar = line[i + 1];

                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === delimiter && !inQuotes) {
                        values.push(current.trim());
                        current = "";
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());

                return values;
            }


            function displayStats() {
                const statsEl = document.getElementById("stats");
                const totalCount = allData.length;
                const films = allData.filter(
                    (r) => r["Type"] === "Film",
                ).length;
                const series = allData.filter(
                    (r) => r["Type"] === "Series",
                ).length;
                const avgRating = (
                    allData.reduce(
                        (sum, r) => sum + (parseFloat(r["Rating ?/10"]) || 0),
                        0,
                    ) / allData.length
                ).toFixed(1);
                const withBogdan = allData.filter(
                    (r) => r["Bogdan"] === "Yes",
                ).length;

                statsEl.innerHTML = `
                <div class="group relative bg-gradient-to-br from-white/5 to-white/10 backdrop-blur-md px-6 py-4 rounded-xl border border-white/10 text-center hover:border-primary/50 transition-all duration-300 hover:scale-105 min-w-[120px]">
                    <div class="text-xs uppercase tracking-wider text-gray-400 mb-2 font-semibold">📊 Total</div>
                    <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-primary to-red-400">${totalCount}</div>
                </div>
                <div class="group relative bg-gradient-to-br from-white/5 to-white/10 backdrop-blur-md px-6 py-4 rounded-xl border border-white/10 text-center hover:border-blue-500/50 transition-all duration-300 hover:scale-105 min-w-[120px]">
                    <div class="text-xs uppercase tracking-wider text-gray-400 mb-2 font-semibold">🎬 Films</div>
                    <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">${films}</div>
                </div>
                <div class="group relative bg-gradient-to-br from-white/5 to-white/10 backdrop-blur-md px-6 py-4 rounded-xl border border-white/10 text-center hover:border-cyan-500/50 transition-all duration-300 hover:scale-105 min-w-[120px]">
                    <div class="text-xs uppercase tracking-wider text-gray-400 mb-2 font-semibold">📺 Series</div>
                    <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-teal-400">${series}</div>
                </div>
                <div class="group relative bg-gradient-to-br from-white/5 to-white/10 backdrop-blur-md px-6 py-4 rounded-xl border border-white/10 text-center hover:border-yellow-500/50 transition-all duration-300 hover:scale-105 min-w-[120px]">
                    <div class="text-xs uppercase tracking-wider text-gray-400 mb-2 font-semibold">⭐ Rating</div>
                    <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-400">${avgRating}</div>
                </div>
                <div class="group relative bg-gradient-to-br from-white/5 to-white/10 backdrop-blur-md px-6 py-4 rounded-xl border border-white/10 text-center hover:border-purple-500/50 transition-all duration-300 hover:scale-105 min-w-[120px]">
                    <div class="text-xs uppercase tracking-wider text-gray-400 mb-2 font-semibold">👥 Bogdan</div>
                    <div class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">${withBogdan}</div>
                </div>
            `;
            }

            function createFilters() {
                // Type filters
                const typeContainer = document.getElementById("typeFilters");
                typeContainer.innerHTML = "";
                ["All", "Film", "Series"].forEach((type) => {
                    const btn = document.createElement("button");
                    btn.className =
                        "px-4 py-2 border-2 border-primary bg-black/30 text-white rounded-full cursor-pointer transition-all duration-300 font-semibold text-xs" + (type === "All" ? " !bg-primary scale-105" : " hover:bg-primary hover:scale-105");
                    btn.textContent = type;
                    btn.onclick = () => setFilter("type", type.toLowerCase());
                    typeContainer.appendChild(btn);
                });

                // Genre filters
                const genreContainer = document.getElementById("genreFilters");
                genreContainer.innerHTML = "";
                const genres = new Map(); // Use Map to track normalized -> display name
                allData.forEach((row) => {
                    if (row["Genre"]) {
                        row["Genre"]
                            .split("/")
                            .forEach((g) => {
                                const trimmed = g.trim();
                                const normalized = trimmed.toLowerCase();
                                // Keep the first occurrence's capitalization
                                if (!genres.has(normalized)) {
                                    genres.set(normalized, trimmed);
                                }
                            });
                    }
                });
                const allGenreBtn = document.createElement("button");
                allGenreBtn.className = "px-4 py-2 border-2 border-primary !bg-primary scale-105 text-white rounded-full cursor-pointer transition-all duration-300 font-semibold text-xs";
                allGenreBtn.textContent = "All";
                allGenreBtn.onclick = () => setFilter("genre", "all");
                genreContainer.appendChild(allGenreBtn);

                [...genres.entries()]
                    .sort((a, b) => a[1].localeCompare(b[1]))
                    .forEach(([normalized, displayName]) => {
                        const btn = document.createElement("button");
                        btn.className = "px-4 py-2 border-2 border-primary bg-black/30 text-white rounded-full cursor-pointer transition-all duration-300 font-semibold text-xs hover:bg-primary hover:scale-105";
                        btn.textContent = displayName;
                        btn.onclick = () => setFilter("genre", normalized);
                        genreContainer.appendChild(btn);
                    });

                // Rating filters
                const ratingContainer =
                    document.getElementById("ratingFilters");
                ratingContainer.innerHTML = "";
                ["All", "10", "9-10", "8-9", "7-8", "<7"].forEach((rating) => {
                    const btn = document.createElement("button");
                    btn.className =
                        "px-4 py-2 border-2 border-primary bg-black/30 text-white rounded-full cursor-pointer transition-all duration-300 font-semibold text-xs" + (rating === "All" ? " !bg-primary scale-105" : " hover:bg-primary hover:scale-105");
                    btn.textContent = rating === "All" ? "All" : rating;
                    btn.onclick = () =>
                        setFilter("rating", rating.toLowerCase());
                    ratingContainer.appendChild(btn);
                });

                // Physical Format filters
                const formatContainer = document.getElementById("physicalFormatFilters");
                formatContainer.innerHTML = "";
                const formats = new Map();
                allData.forEach((row) => {
                    if (row["Physical Format"]) {
                        const formatStr = row["Physical Format"].replace(/^"+|"+$/g, '').trim(); // Remove quotes
                        if (formatStr && !formatStr.match(/^\d{2}\/\d{4}$/)) { // Skip date entries
                            // Split by comma like genres are split by slash
                            formatStr.split(',').forEach((f) => {
                                const trimmed = f.trim();
                                if (trimmed) {
                                    const normalized = trimmed.toLowerCase();
                                    if (!formats.has(normalized)) {
                                        formats.set(normalized, trimmed);
                                    }
                                }
                            });
                        }
                    }
                });
                const allFormatBtn = document.createElement("button");
                allFormatBtn.className = "px-4 py-2 border-2 border-primary !bg-primary scale-105 text-white rounded-full cursor-pointer transition-all duration-300 font-semibold text-xs";
                allFormatBtn.textContent = "All";
                allFormatBtn.onclick = () => setFilter("physicalFormat", "all");
                formatContainer.appendChild(allFormatBtn);

                [...formats.entries()]
                    .sort((a, b) => a[1].localeCompare(b[1]))
                    .forEach(([normalized, displayName]) => {
                        const btn = document.createElement("button");
                        btn.className = "px-4 py-2 border-2 border-primary bg-black/30 text-white rounded-full cursor-pointer transition-all duration-300 font-semibold text-xs hover:bg-primary hover:scale-105";
                        btn.textContent = displayName;
                        btn.onclick = () => setFilter("physicalFormat", normalized);
                        formatContainer.appendChild(btn);
                    });

                // Special filters
                const specialContainer =
                    document.getElementById("specialFilters");
                specialContainer.innerHTML = "";
                [
                    "All",
                    "Watched w/ Bogdan",
                    "Physical Copy",
                    "High Rewatch",
                ].forEach((special) => {
                    const btn = document.createElement("button");
                    btn.className =
                        "px-4 py-2 border-2 border-primary bg-black/30 text-white rounded-full cursor-pointer transition-all duration-300 font-semibold text-xs" + (special === "All" ? " !bg-primary scale-105" : " hover:bg-primary hover:scale-105");
                    btn.textContent = special;
                    btn.onclick = () =>
                        setFilter("special", special.toLowerCase());
                    specialContainer.appendChild(btn);
                });
            }

            function setFilter(category, value) {
                activeFilters[category] = value;

                document
                    .querySelectorAll(`#${category}Filters button`)
                    .forEach((btn) => {
                        btn.classList.remove("!bg-primary", "scale-105");
                        btn.classList.add("bg-black/30");
                    });
                event.target.classList.remove("bg-black/30");
                event.target.classList.add("!bg-primary", "scale-105");

                applyFilters();
            }

            function applyFilters() {
                filteredData = allData.filter((row) => {
                    if (
                        activeFilters.type !== "all" &&
                        row["Type"].toLowerCase() !== activeFilters.type
                    ) {
                        return false;
                    }

                    if (activeFilters.genre !== "all") {
                        const rowGenres = row["Genre"].toLowerCase();
                        if (!rowGenres.includes(activeFilters.genre)) {
                            return false;
                        }
                    }

                    if (activeFilters.rating !== "all") {
                        const rating = parseFloat(row["Rating ?/10"]) || 0;
                        if (activeFilters.rating === "10" && rating !== 10)
                            return false;
                        if (
                            activeFilters.rating === "9-10" &&
                            (rating < 9 || rating > 10)
                        )
                            return false;
                        if (
                            activeFilters.rating === "8-9" &&
                            (rating < 8 || rating >= 9)
                        )
                            return false;
                        if (
                            activeFilters.rating === "7-8" &&
                            (rating < 7 || rating >= 8)
                        )
                            return false;
                        if (activeFilters.rating === "<7" && rating >= 7)
                            return false;
                    }

                    if (activeFilters.physicalFormat !== "all") {
                        if (!row["Physical Format"]) {
                            return false;
                        }
                        const rowFormats = row["Physical Format"].replace(/^"+|"+$/g, '').trim().toLowerCase();
                        if (!rowFormats.includes(activeFilters.physicalFormat)) {
                            return false;
                        }
                    }

                    if (activeFilters.special !== "all") {
                        if (
                            activeFilters.special === "watched w/ bogdan" &&
                            row["Bogdan"] !== "Yes"
                        )
                            return false;
                        if (
                            activeFilters.special === "physical copy" &&
                            !row["Physical Format"]
                        )
                            return false;
                        if (
                            activeFilters.special === "high rewatch" &&
                            parseFloat(row["Rewatch potential"]) < 9
                        )
                            return false;
                    }

                    return true;
                });

                filterCards();
            }

            function filterCards() {
                const searchTerm = document
                    .getElementById("searchBox")
                    .value.toLowerCase();

                const filtered = filteredData.filter((row) => {
                    return Object.values(row).some((value) =>
                        String(value).toLowerCase().includes(searchTerm),
                    );
                });

                displayCards(filtered);
            }

            function sortCards() {
                const sortBy = document.getElementById("sortSelect").value;

                filteredData.sort((a, b) => {
                    switch (sortBy) {
                        case "name":
                            return a["Name"].localeCompare(b["Name"]);
                        case "rating-desc":
                            return (
                                (parseFloat(b["Rating ?/10"]) || 0) -
                                (parseFloat(a["Rating ?/10"]) || 0)
                            );
                        case "rating-asc":
                            return (
                                (parseFloat(a["Rating ?/10"]) || 0) -
                                (parseFloat(b["Rating ?/10"]) || 0)
                            );
                        case "watch-count":
                            return (
                                (parseInt(b["Watch count"]) || 0) -
                                (parseInt(a["Watch count"]) || 0)
                            );
                        case "date-latest":
                            return (b["Latest Watch"] || "").localeCompare(
                                a["Latest Watch"] || "",
                            );
                        case "date-first":
                            return (b["1st Watch"] || "").localeCompare(
                                a["1st Watch"] || "",
                            );
                        default:
                            return 0;
                    }
                });

                filterCards();
            }

            async function displayCards(data) {
                const grid = document.getElementById("cardsGrid");
                grid.innerHTML = "";

                if (data.length === 0) {
                    grid.innerHTML =
                        '<p class="text-white text-center w-full text-xl">No titles match your filters 🎬</p>';
                    return;
                }

                for (const [index, row] of data.entries()) {
                    const card = document.createElement("div");
                    card.className = "bg-white/8 backdrop-blur-md rounded-3xl p-0 border border-white/15 shadow-[0_10px_30px_rgba(0,0,0,0.3)] transition-all duration-300 animate-fadeInUp relative overflow-hidden cursor-pointer hover:-translate-y-2.5 hover:scale-[1.02] hover:shadow-[0_20px_40px_rgba(233,69,96,0.4)] hover:border-primary card";
                    card.style.animationDelay = `${index * 0.03}s`;
                    card.onclick = () => openModal(row);

                    const posterDiv = document.createElement("div");
                    posterDiv.className = "w-full h-[280px] bg-gradient-to-br from-primary/20 to-black/40 flex items-center justify-center text-3xl animate-pulse-slow";
                    posterDiv.textContent = "🎬";

                    const rating = row["Rating ?/10"];
                    const hasPhysical =
                        row["Physical Format"] && row["Physical Format"].trim();
                    const withBogdan = row["Bogdan"] === "Yes";
                    const rewatchPotential =
                        parseFloat(row["Rewatch potential"]) || 0;

                    const ratingValue = parseFloat(rating);
                    const isGoldRating = ratingValue === 11;

                    const ratingBadgeClass = isGoldRating
                        ? 'bg-gradient-to-br from-yellow-400 to-yellow-600 text-black shadow-[0_4px_10px_rgba(255,215,0,0.5)]'
                        : 'bg-gradient-to-br from-primary to-primary-dark text-white shadow-[0_4px_10px_rgba(233,69,96,0.3)]';

                    const badgeFilm = 'bg-blue-500/30 border border-blue-500 text-blue-500';
                    const badgeSeries = 'bg-cyan-400/30 border border-cyan-400 text-cyan-400';
                    const badgeBogdan = 'bg-purple-500/30 border-2 border-purple-500 text-purple-500 font-bold';
                    const badgePhysical = 'bg-orange-500/30 border border-orange-500 text-orange-500';
                    const badgeRewatch = 'bg-green-500/30 border border-green-500 text-green-500';

                    let html = `
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="text-white text-lg flex-1">${row["Name"]}</h3>
                            ${rating && rating !== "?" ? `<div class="px-2.5 py-1.5 rounded-lg font-bold text-sm min-w-[45px] text-center ${ratingBadgeClass}">${rating}/10</div>` : ""}
                        </div>
                        <div class="flex gap-1.5 flex-wrap mb-3">
                            <span class="px-2.5 py-1 rounded-xl text-[0.7em] font-semibold uppercase tracking-wide ${row["Type"].toLowerCase() === 'film' ? badgeFilm : badgeSeries}">${row["Type"]}</span>
                            ${withBogdan ? `<span class="px-2.5 py-1 rounded-xl text-[0.7em] font-semibold uppercase tracking-wide ${badgeBogdan}">👥 Bogdan</span>` : ""}
                            ${hasPhysical ? `<span class="px-2.5 py-1 rounded-xl text-[0.7em] font-semibold uppercase tracking-wide ${badgePhysical}">💿 Physical</span>` : ""}
                            ${rewatchPotential >= 9 ? `<span class="px-2.5 py-1 rounded-xl text-[0.7em] font-semibold uppercase tracking-wide ${badgeRewatch}">♻️ Rewatch</span>` : ""}
                        </div>
                `;

                    headers.forEach((header) => {
                        if (
                            row[header] &&
                            row[header].trim() &&
                            row[header].trim().toUpperCase() !== "N/A" &&
                            header !== "Name" &&
                            header !== "Type" &&
                            header !== "Rating ?/10" &&
                            header !== "Bogdan" &&
                            header !== "Physical Format" &&
                            header !== "Rewatch potential"
                        ) {
                            const isWatchCount = header === "Watch count";
                            const watchCountValue = isWatchCount ? parseInt(row[header]) : 0;
                            const isGoldenWatchCount = isWatchCount && watchCountValue >= 10;
                            const goldenClass = isGoldenWatchCount ? 'bg-gradient-to-br from-yellow-400 to-yellow-600 text-black font-bold px-3 py-1.5 rounded-lg inline-block shadow-[0_4px_10px_rgba(255,215,0,0.5)]' : '';
                            html += `<div class="my-1.5 py-1.5 border-b border-white/10 text-sm last:border-b-0"><div class="font-semibold text-primary text-xs uppercase tracking-wide opacity-90">${header}</div><div class="text-white mt-1 opacity-90 ${goldenClass}">${row[header]}</div></div>`;
                        }
                    });

                    html += "</div>";

                    card.innerHTML = html;
                    card.insertBefore(posterDiv, card.firstChild);
                    grid.appendChild(card);

                    // Fetch poster - pass Comments for year and Genre for anime detection
                    fetchMoviePoster(
                        row["Name"],
                        row["1st Watch"],
                        row["Comments"],
                        row["Genre"],
                    ).then((posterUrl) => {
                        if (posterUrl) {
                            const img = document.createElement("img");
                            img.src = posterUrl;
                            img.className = "w-full h-[280px] object-contain bg-gradient-to-br from-primary/20 to-black/40";
                            img.alt = row["Name"];
                            posterDiv.replaceWith(img);
                        } else {
                            posterDiv.classList.remove("animate-pulse-slow");
                        }
                    });
                }
            }

            function openModal(row) {
                const modal = document.getElementById("modal");
                const modalBody = document.getElementById("modalBody");
                const modalPoster = document.getElementById("modalPoster");

                const rating = row["Rating ?/10"];
                const hasPhysical =
                    row["Physical Format"] && row["Physical Format"].trim();
                const withBogdan = row["Bogdan"] === "Yes";
                const rewatchPotential =
                    parseFloat(row["Rewatch potential"]) || 0;

                const ratingValue = parseFloat(rating);
                const isGoldRating = ratingValue === 11;

                // Physical format badge colors
                const physicalColors = [
                    'bg-orange-500/30 border border-orange-500 text-orange-500',
                    'bg-purple-500/30 border border-purple-500 text-purple-500',
                    'bg-blue-500/30 border border-blue-500 text-blue-500',
                    'bg-green-500/30 border border-green-500 text-green-500',
                    'bg-yellow-500/30 border border-yellow-500 text-yellow-500'
                ];

                // Create physical format badges
                let physicalBadges = "";
                if (hasPhysical) {
                    const formats = row["Physical Format"].split(',').map(f => f.trim());
                    physicalBadges = formats.map((format, index) => {
                        const colorClass = physicalColors[index % 5];
                        return `<span class="px-4 py-2 rounded-xl text-base font-semibold uppercase tracking-wide ${colorClass}">💿 ${format}</span>`;
                    }).join('\n                    ');
                }

                const badgeFilm = 'bg-blue-500/30 border border-blue-500 text-blue-500';
                const badgeSeries = 'bg-cyan-400/30 border border-cyan-400 text-cyan-400';
                const badgeBogdan = 'bg-purple-500/30 border-2 border-purple-500 text-purple-500 font-bold';
                const badgeRewatch = 'bg-green-500/30 border border-green-500 text-green-500';

                const ratingBadgeClass = isGoldRating
                    ? 'bg-gradient-to-br from-yellow-400 to-yellow-600 text-black shadow-[0_4px_10px_rgba(255,215,0,0.5)]'
                    : 'bg-gradient-to-br from-primary to-primary-dark text-white shadow-[0_4px_10px_rgba(233,69,96,0.3)]';

                let html = `
                <div class="flex gap-2.5 flex-wrap mb-5">
                    <span class="px-4 py-2 rounded-xl text-base font-semibold uppercase tracking-wide ${row["Type"].toLowerCase() === 'film' ? badgeFilm : badgeSeries}">${row["Type"]}</span>
                    ${withBogdan ? `<span class="px-4 py-2 rounded-xl text-base font-semibold uppercase tracking-wide ${badgeBogdan}">👥 Bogdan</span>` : ""}
                    ${physicalBadges}
                    ${rewatchPotential >= 9 ? `<span class="px-4 py-2 rounded-xl text-base font-semibold uppercase tracking-wide ${badgeRewatch}">♻️ High Rewatch</span>` : ""}
                </div>
                <div class="mb-5">
                    <h2 class="text-4xl text-white mb-4 pr-16">${row["Name"]}</h2>
                    ${rating && rating !== "?" ? `<div class="inline-block"><div class="px-5 py-3 rounded-lg font-bold text-2xl min-w-[60px] text-center ${ratingBadgeClass}">${rating}/10</div></div>` : ""}
                </div>
            `;

                headers.forEach((header) => {
                    if (
                        row[header] &&
                        row[header].trim() &&
                        row[header].trim().toUpperCase() !== "N/A" &&
                        header !== "Name" &&
                        header !== "Type" &&
                        header !== "Rating ?/10" &&
                        header !== "Bogdan" &&
                        header !== "Physical Format" &&
                        header !== "Rewatch potential"
                    ) {
                        const isWatchCount = header === "Watch count";
                        const watchCountValue = isWatchCount ? parseInt(row[header]) : 0;
                        const isGoldenWatchCount = isWatchCount && watchCountValue >= 10;
                        const goldenClass = isGoldenWatchCount ? 'bg-gradient-to-br from-yellow-400 to-yellow-600 text-black font-bold px-4 py-2 rounded-lg inline-block shadow-[0_4px_10px_rgba(255,215,0,0.5)]' : '';
                        html += `
                        <div class="my-4 p-4 bg-white/5 rounded-xl border-l-4 border-primary">
                            <div class="font-semibold text-primary text-sm uppercase tracking-wide mb-2">${header}</div>
                            <div class="text-white text-lg leading-relaxed ${goldenClass}">${row[header]}</div>
                        </div>
                    `;
                    }
                });

                modalBody.innerHTML = html;

                // Set poster - pass Comments for year and Genre for anime detection
                fetchMoviePoster(
                    row["Name"],
                    row["1st Watch"],
                    row["Comments"],
                    row["Genre"],
                ).then((posterUrl) => {
                    if (posterUrl) {
                        modalPoster.src = posterUrl;
                        modalPoster.classList.remove("hidden");
                    } else {
                        modalPoster.classList.add("hidden");
                    }
                });

                modal.classList.remove("hidden");
                modal.classList.add("flex");
                document.body.style.overflow = "hidden";
            }

            function closeModal() {
                const modal = document.getElementById("modal");
                modal.classList.add("hidden");
                modal.classList.remove("flex");
                document.body.style.overflow = "auto";
            }

            // Close modal on outside click
            document.getElementById("modal").onclick = function (event) {
                if (event.target === this) {
                    closeModal();
                }
            };

            // Close modal on Escape key
            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape") {
                    closeModal();
                }
            });
        </script>
    </body>
</html>
